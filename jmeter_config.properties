# JMeter Load Test Configuration
# This file contains configurable parameters for the load test

# Server Configuration
server.host=localhost
server.port=8080
server.protocol=http
server.base_path=/

# Authentication
auth.username=testuser
auth.password=testpass
auth.login_endpoint=/api/login
auth.token_header=Authorization
auth.token_prefix=Bearer

# API Endpoints
api.data_endpoint=/api/data
api.home_endpoint=/

# Load Test Parameters
load.users=50
load.ramp_up=30
load.duration=300
load.loops=10
load.think_time=1000

# Test Scenarios
# Light Load: users=10, ramp_up=10, duration=60
# Medium Load: users=50, ramp_up=30, duration=300
# Heavy Load: users=100, ramp_up=60, duration=600
# Stress Test: users=200, ramp_up=120, duration=1800

# Response Time Thresholds (milliseconds)
threshold.response_time.avg=1000
threshold.response_time.90th_percentile=2000
threshold.response_time.max=5000

# Error Rate Thresholds (percentage)
threshold.error_rate=5.0

# Timeout Settings (milliseconds)
timeout.connect=5000
timeout.response=30000

# Report Settings
report.generate_html=true
report.output_dir=jmeter_report
report.results_file=results.jtl